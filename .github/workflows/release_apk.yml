name: Build and Release APK

# Builds a release-signed arm64 APK (complete with bundled arm64-v8a Linux
# runtime and libtawcroot.so), verifies v1/v2/v3 APK signatures, and publishes
# a GitHub Release with `update.json` + `SHA256SUMS` on every merge to `main`.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional versionCode override (2..2100000000); leave empty for UTC+8 build minute"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish as latest GitHub Release"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-apk-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  android:
    name: Build & Sign arm64 Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
    env:
      DSH_MAVEN_MIRRORS: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore cached arm64-v8a Linux runtime bundle
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            runtime/out/arm64-v8a
            runtime/out/manifest.json
          key: runtime-bundle-arm64-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/lib/**', 'runtime/locks/**', 'runtime/patches/**', 'runtime/bridge/**', 'runtime/media/**', 'runtime/session-deletion/**') }}

      - name: Build arm64-v8a Linux runtime bundle
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xz-utils zstd gpgv ca-certificates
          bash runtime/build-runtime.sh arm64-v8a

      - name: Save arm64-v8a Linux runtime bundle cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            runtime/out/arm64-v8a
            runtime/out/manifest.json
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Write release signing key
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
            echo "::error::SIGN_KEYSTORE_BASE64 is not set; release builds must be signed."
            exit 1
          fi
          umask 077
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > app/android/app/release.jks
          python3 - <<'PY'
          import os, pathlib
          def esc(s: str) -> str:
              return s.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          lines = [
              'storeFile=release.jks',
              f"storePassword={esc(os.environ['KEYSTORE_PASSWORD'])}",
              f"keyAlias={esc(os.environ['KEY_ALIAS'])}",
              f"keyPassword={esc(os.environ['KEY_PASSWORD'])}",
          ]
          pathlib.Path('app/android/key.properties').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Install Android NDK for libtawcroot.so and build signed arm64 APK
        id: build
        env:
          BUILD_NUM_INPUT: ${{ inputs.build_number }}
          REPO_LOWER: ${{ github.repository }}
        run: |
          (cd app && flutter pub get --enforce-lockfile)
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > app/android/local.properties
          # Ensure the exact NDK version pinned in runtime/tawcroot/source.json is installed
          ndk_ver=$(python3 -c 'import json,pathlib; print(json.loads(pathlib.Path("runtime/tawcroot/source.json").read_text())["ndkVersion"])')
          if [ ! -d "$ANDROID_HOME/ndk/$ndk_ver" ]; then
            set +o pipefail
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_ver" >/dev/null
            set -o pipefail
          fi
          test -f "$ANDROID_HOME/ndk/$ndk_ver/source.properties"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ndk_ver"

          num_args=()
          if [ -n "$BUILD_NUM_INPUT" ]; then
            num_args=(-n "$BUILD_NUM_INPUT")
          fi
          bash tooling/build-apk.sh -f arm64 "${num_args[@]}" -- \
            "--dart-define=DSH_UPDATE_REPO=${REPO_LOWER}" \
            "--dart-define=DSH_UPDATE_MIRROR=" \
            "--dart-define=DSH_UPDATE_FEED="

          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          apk="app/build/app/outputs/flutter-apk/app-arm64-release.apk"
          badge=$("$tools/aapt2" dump badging "$apk" | sed -n '/^package:/p')
          echo "Built package: $badge"
          pkg_name=$(echo "$badge" | sed -n "s/.*name='\([^']*\)'.*/\1/p")
          ver_code=$(echo "$badge" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          ver_name=$(echo "$badge" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          {
            echo "package_name=$pkg_name"
            echo "version_code=$ver_code"
            echo "version_name=$ver_name"
            echo "tag=v${ver_name}+${ver_code}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify zipalign and v1/v2/v3 release signatures (reject debug cert)
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          apk="app/build/app/outputs/flutter-apk/app-arm64-release.apk"
          "$tools/zipalign" -c 4 "$apk"
          verify_out=$("$tools/apksigner" verify --verbose --print-certs --min-sdk-version 21 "$apk")
          echo "$verify_out" | grep -v "DN:"
          echo "$verify_out" | grep -q "Verified using v1 scheme (JAR signing): true"
          echo "$verify_out" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          echo "$verify_out" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          if echo "$verify_out" | grep -q "CN=Android Debug"; then
            echo "::error::APK was signed with Android Debug certificate instead of release key!"
            exit 1
          fi

      - name: Generate release notes and update.json / SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_RELEASE_REPO: ${{ github.repository }}
          TAG: ${{ steps.build.outputs.tag }}
          VER_NAME: ${{ steps.build.outputs.version_name }}
          VER_CODE: ${{ steps.build.outputs.version_code }}
          PKG_NAME: ${{ steps.build.outputs.package_name }}
        run: |
          prev_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          {
            echo "## DSH Go ${VER_NAME} (${VER_CODE})"
            echo ""
            echo "- **Package ID**: \`${PKG_NAME}\`"
            echo "- **Commit**: \`${GITHUB_SHA::8}\`"
            echo ""
            if [ -n "$prev_tag" ] && git rev-parse "$prev_tag" >/dev/null 2>&1; then
              echo "### Changes since \`${prev_tag}\`"
              git log --no-merges --pretty=format:"- %s (\`%h\`)" "${prev_tag}..HEAD" || true
            else
              echo "### Recent Changes"
              git log --no-merges -n 10 --pretty=format:"- %s (\`%h\`)" || true
            fi
            echo ""
          } > "$RUNNER_TEMP/notes.md"

          python3 tooling/release_assets.py \
            --version "${VER_NAME}+${VER_CODE}" \
            --tag "$TAG" \
            --notes "$RUNNER_TEMP/notes.md" \
            --delta-from 0 \
            --out dist

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          name: dsh-go-${{ steps.build.outputs.version_name }}-${{ steps.build.outputs.version_code }}-arm64.apk
          path: dist/dsh-go-*-arm64.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          TITLE: "DSH Go ${{ steps.build.outputs.version_name }} (${{ steps.build.outputs.version_code }})"
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest --repo "$GITHUB_REPOSITORY" dist/*
          fi

      - name: Clean temporary keystore files
        if: always()
        run: rm -f app/android/key.properties app/android/app/release.jks
